name: War Room Car Scout

# Hourly web scan for underpriced cars. Note: GitHub only fires `schedule`
# from the DEFAULT branch, so the hourly cadence starts once this file lands
# on master. Until then it can be run manually (workflow_dispatch), and the
# daily Vercel cron covers the baseline.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch: {}
  # Self-test hook: editing this file on the working branch fires one scan
  # immediately (schedule + dispatch only register from the default branch).
  push:
    branches: ['claude/repo-check-3OrRV']
    paths: ['.github/workflows/car-scout.yml']

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Scout scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "ERROR: RESEND_API_KEY secret missing — cannot derive the cron key."; exit 1
          fi
          KEY=$(printf '%s' "$RESEND_API_KEY" | sha256sum | cut -d' ' -f1)
          RESP=$(curl -sS -m 120 -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "x-cron-key: $KEY" \
            "https://mandmautoperformance.com/api/war-room/scan" || true)
          echo "$RESP" | sed 's/HTTP_STATUS:[0-9]*//'
          CODE=$(echo "$RESP" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$CODE" = "200" ]; then
            echo "✓ Scan completed."
          else
            echo "✗ Scan failed (HTTP ${CODE:-none})."; exit 1
          fi
# Sweep note: scans cover BOTH markets (cars + land) as of the Land Scout build.
