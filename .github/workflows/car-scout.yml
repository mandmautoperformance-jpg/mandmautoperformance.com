name: War Room Car Scout

# Scheduled web scan for underpriced cars/land. GitHub only fires `schedule`
# from the DEFAULT branch, so this cadence starts once this file lands on
# master. Runs every 3 hours (8×/day) to keep API + Actions cost sensible while
# staying fresh — dial the cron up/down to taste. Also runnable on demand.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Scout scan
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "ERROR: RESEND_API_KEY secret missing — cannot derive the cron key."; exit 1
          fi
          KEY=$(printf '%s' "$RESEND_API_KEY" | sha256sum | cut -d' ' -f1)
          RESP=$(curl -sS -m 120 -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "x-cron-key: $KEY" \
            "https://mandmautoperformance.com/api/war-room/scan" || true)
          echo "$RESP" | sed 's/HTTP_STATUS:[0-9]*//'
          CODE=$(echo "$RESP" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$CODE" = "200" ]; then
            echo "✓ Scan completed."
          else
            echo "✗ Scan failed (HTTP ${CODE:-none})."; exit 1
          fi
# Sweep note: scans cover BOTH markets (cars + land); zero-value finds are rejected at parse.
